<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Yield Prediction • KrishiDrishti</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ----- RESET & GLOBAL ----- */
  :root {
    --amber: #f5a623;
    --amber-deep: #c97a0a;
    --navy: #0d1117;
    --card-bg: rgba(13, 17, 23, 0.88);
    --input-bg: rgba(255,255,255,0.06);
    --input-border: rgba(255,255,255,0.12);
    --accent: #6ee7b7;
    --text-dim: rgba(255,255,255,0.45);
    --radius: 20px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    background: #0a0f0a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 24px 16px;
  }

  /* Background layers (unchanged) */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0;
    background: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover no-repeat;
  }
  .bg-layer::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(0,0,0,0.38);
  }
  .grain {
    position: fixed; inset: 0; z-index: 1; opacity: 0.032;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px 200px; pointer-events: none;
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.22; pointer-events: none; z-index: 0; animation: drift 14s ease-in-out infinite alternate; }
  .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #f59e0b, transparent 70%); top:-100px; left:-100px; animation-duration:16s; }
  .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #10b981, transparent 70%); bottom:-80px; right:-80px; animation-duration:12s; animation-delay:-5s; }
  .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, #6366f1, transparent 70%); top:40%; left:55%; animation-duration:18s; animation-delay:-8s; }
  @keyframes drift { from{transform:translate(0,0) scale(1);} to{transform:translate(30px,20px) scale(1.06);} }

  /* Back + sign out */
  .back, .signout {
    position: fixed; top: 22px; z-index: 50;
    padding: 9px 16px; border-radius: 10px;
    font-size: 13.5px; font-family: 'DM Sans', sans-serif; font-weight: 500;
    backdrop-filter: blur(10px); transition: all 0.2s; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    animation: cardIn 0.6s both;
  }
  .back { left: 22px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); }
  .back:hover { border-color: rgba(255,255,255,0.3); background: rgba(0,0,0,0.7); color: #fff; }
  .signout { right: 22px; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; }
  .signout:hover { border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.18); color: #fff; }

  /* MAIN CARD */
  .container {
    position: relative; z-index: 10;
    display: grid;
    grid-template-columns: 0.9fr 1.1fr;
    width: min(1020px, 100%);
    min-height: 560px;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
    backdrop-filter: blur(2px);
    animation: cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(28px) scale(0.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }

  /* LEFT PANEL (image + result) */
  .left {
    position: relative;
    background: url('Pic/x3.jpg') center/cover no-repeat;
    overflow: hidden;
    min-height: 560px;
    transition: background-image 0.6s ease;
  }
  .left-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(10,8,4,0.3) 0%, rgba(20,30,14,0.5) 50%, rgba(5,8,3,0.82) 100%);
    transition: opacity 0.5s ease;
  }
  .left-brand {
    position: absolute; top: 28px; left: 28px; z-index: 4;
    display: flex; align-items: center; gap: 9px;
  }
  .left-brand h2 { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: #fff; }
  .left-pills {
    position: absolute; bottom: 28px; left: 28px; z-index: 4;
    display: flex; gap: 8px; flex-wrap: wrap;
    transition: opacity 0.5s ease;
  }
  .pill {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(6px);
    font-size: 11.5px; color: rgba(255,255,255,0.72); font-weight: 500;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 6px var(--accent);
    animation: dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.5;transform:scale(0.7);} }

  .waiting-state {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    transition: opacity 0.5s ease;
  }
  .waiting-state.hidden { opacity: 0; pointer-events: none; }
  .pulse-ring {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(245,166,35,0.4);
    display: flex; align-items: center; justify-content: center;
    animation: pulseRing 2.5s ease infinite; color: var(--amber);
  }
  @keyframes pulseRing {
    0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,0.28);}
    50%{box-shadow:0 0 0 16px rgba(245,166,35,0);}
  }
  .waiting-state p { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.38); }

  .result-overlay {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 24px 22px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.7s ease;
  }
  .result-overlay.visible { opacity: 1; pointer-events: auto; }
  .result-glass {
    background: rgba(5,10,5,0.72);
    backdrop-filter: blur(32px) saturate(1.4);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    padding: 18px 20px 20px;
    transform: translateY(18px);
    transition: transform 0.65s cubic-bezier(0.22,1,0.36,1) 0.1s;
  }
  .result-overlay.visible .result-glass { transform: translateY(0); }
  .res-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(245,166,35,0.15); border: 1px solid rgba(245,166,35,0.38);
    border-radius: 100px; padding: 3px 12px;
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.1em;
    color: var(--amber); margin-bottom: 10px;
  }
  .res-heading { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 3px; }
  .res-heading span { color: var(--amber); font-style: italic; }
  .res-subline { font-size: 0.79rem; color: rgba(255,255,255,0.48); margin-bottom: 13px; }
  .res-subline strong { color: rgba(255,255,255,0.82); }
  .res-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-bottom: 11px; }
  .res-stat { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 10px; text-align: center; }
  .res-stat-val { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700; color: #fff; line-height: 1; }
  .res-stat-lbl { font-size: 0.57rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(255,255,255,0.32); margin-top: 3px; }
  .res-yield {
    background: linear-gradient(135deg, rgba(245,166,35,0.14), rgba(245,166,35,0.04));
    border: 1px solid rgba(245,166,35,0.28); border-radius: 12px;
    padding: 11px 15px; display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 11px;
  }
  .res-yield-lbl { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: rgba(255,255,255,0.38); margin-bottom: 2px; }
  .res-yield-val { font-family: 'Playfair Display', serif; font-size: 1.75rem; font-weight: 700; color: var(--amber); line-height: 1; }
  .res-yield-unit { font-size: 0.7rem; color: rgba(255,255,255,0.32); margin-left: 3px; }
  .res-yield-total { font-size: 0.68rem; color: rgba(255,255,255,0.28); margin-top: 3px; }
  .res-yield-icon { width: 38px; height: 38px; border-radius: 50%; background: rgba(245,166,35,0.12); border: 1px solid rgba(245,166,35,0.28); display: flex; align-items: center; justify-content: center; color: var(--amber); }
  .res-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .res-tag { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; padding: 3px 10px; font-size: 0.67rem; color: rgba(255,255,255,0.48); }

  /* ----- RIGHT PANEL (REFINED: NO SCROLL, COMPACT) ----- */
  .right {
    background: var(--card-bg);
    padding: 24px 28px 28px;
    backdrop-filter: blur(24px);
    border-left: 1px solid rgba(255,255,255,0.06);
    overflow-y: visible;      /* no forced scrollbar */
    max-height: none;
    display: flex;
    flex-direction: column;
  }

  .right-header { margin-bottom: 14px; }
  .right-header .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: var(--amber); margin-bottom: 5px; }
  .right-header h2 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -0.4px; }
  .right-header p { margin-top: 2px; font-size: 12.5px; color: var(--text-dim); }

  /* new form row system — compact & responsive */
  .form-fields {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 4px;
  }
  .form-row-2cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-row-3cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .form-row-single {
    width: 100%;
  }

  /* unified input-group styling */
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .input-group label {
    font-size: 11.5px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .opt-tag {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.32);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .input-wrap {
    position: relative;
  }
  .input-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.28);
    pointer-events: none;
    transition: color 0.2s;
  }
  .input-group:focus-within .input-icon { color: var(--amber); }

  .input, select.input {
    width: 100%;
    padding: 10px 10px 10px 34px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 11px;
    color: #fff;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    outline: none;
  }
  select.input { cursor: pointer; }
  select.input option { background: #0d1a0d; color: #fff; }
  .input::placeholder { color: rgba(255,255,255,0.2); }
  .input:focus {
    border-color: var(--amber);
    background: rgba(245,166,35,0.06);
    box-shadow: 0 0 0 3px rgba(245,166,35,0.11);
  }

  .error-msg {
    font-size: 12px;
    color: #f87171;
    min-height: 16px;
    margin-top: 8px;
    padding-left: 2px;
    display: none;
  }
  .error-msg.show { display: block; }

  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #1a0d00;
    font-weight: 700;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: all 0.25s cubic-bezier(0.22,1,0.36,1);
    box-shadow: 0 4px 20px rgba(245,158,11,0.35);
    position: relative;
    overflow: hidden;
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(245,158,11,0.5); }
  .btn:hover::before { opacity: 1; }
  .btn:active { transform: translateY(0); }
  .btn.loading { opacity: 0.72; pointer-events: none; }
  .spin { animation: spin 1s linear infinite; display: inline-flex; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(5px);}
  }

  /* responsive */
  @media(max-width: 820px) {
    .container { grid-template-columns: 1fr; width: 95%; }
    .left { min-height: 260px; }
    .left-pills { display: none; }
    .right { padding: 22px 20px 26px; }
    .form-row-2cols, .form-row-3cols {
      grid-template-columns: 1fr;
      gap: 10px;
    }
  }
  @media(max-width: 500px) {
    .right { padding: 18px 16px 22px; }
    .form-fields { gap: 10px; }
  }
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="grain"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<button class="back" onclick="window.location.href='Main.html'">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  Back
</button>

<button class="signout" onclick="confirmSignout()">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  Sign Out
</button>

<div class="container" id="mainCard">

  <!-- LEFT side: image + result overlay -->
  <div class="left" id="leftPanel">
    <div class="left-overlay" id="leftOverlay"></div>

    <div class="left-brand">
      <img src="Pic/00.png" alt="" style="height:28px;filter:drop-shadow(0 0 6px rgba(245,166,35,0.4));" onerror="this.style.display='none'">
      <h2>KrishiDrishti</h2>
    </div>

    <div class="waiting-state" id="waitingState">
      <div class="pulse-ring">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22V12"/><path d="M5 12c0-3.87 3.13-7 7-7s7 3.13 7 7"/><path d="M5 12H2"/><path d="M22 12h-3"/><path d="M12 2v3"/></svg>
      </div>
      <p>Awaiting Analysis</p>
    </div>

    <div class="result-overlay" id="resultOverlay">
      <div class="result-glass">
        <div class="res-badge">
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          Yield Prediction
        </div>
        <div class="res-heading">In <span id="r_state">—</span></div>
        <div class="res-subline">Crop: <strong id="r_crop">—</strong> &nbsp;·&nbsp; Area: <strong id="r_area">—</strong> ha</div>
        <div class="res-stats">
          <div class="res-stat"><div class="res-stat-val" id="r_temp">—<sup>°C</sup></div><div class="res-stat-lbl">Temp</div></div>
          <div class="res-stat"><div class="res-stat-val" id="r_hum">—<sup>%</sup></div><div class="res-stat-lbl">Humidity</div></div>
          <div class="res-stat"><div class="res-stat-val" id="r_rain">—<sup>mm</sup></div><div class="res-stat-lbl">Rainfall</div></div>
        </div>
        <div class="res-yield">
          <div><div class="res-yield-lbl">Predicted Yield</div><div class="res-yield-val" id="r_yield">—<span class="res-yield-unit"> kg/ha</span></div><div class="res-yield-total" id="r_total"></div></div>
          <div class="res-yield-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22V12"/><path d="M5 12c0-3.87 3.13-7 7-7s7 3.13 7 7"/></svg></div>
        </div>
        <div class="res-tags" id="resTags"></div>
      </div>
    </div>

    <div class="left-pills" id="leftPills">
      <div class="pill"><span class="dot"></span>AI Powered</div>
      <div class="pill"><span class="dot"></span>Soil Analytics</div>
      <div class="pill"><span class="dot"></span>Yield Insights</div>
    </div>
  </div>

  <!-- RIGHT side: compact form without scroll -->
  <div class="right">
    <div class="right-header">
      <div class="eyebrow">Smart Farming Tool</div>
      <h2>Yield Prediction</h2>
      <p>Enter field parameters – instant estimate</p>
    </div>

    <div class="form-fields">
      <!-- ROW 1: State + Crop (side by side) -->
      <div class="form-row-2cols">
        <div class="input-group">
          <label>State / Region</label>
          <div class="input-wrap">
            <select class="input" id="state_name">
              <option value="" disabled selected>Select state</option>
              <option>Andhra Pradesh</option><option>Assam</option><option>Bihar</option><option>Chhattisgarh</option><option>Gujarat</option><option>Haryana</option>
              <option>Himachal Pradesh</option><option>Jharkhand</option><option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option><option>Maharashtra</option>
              <option>Manipur</option><option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option><option>Odisha</option><option>Punjab</option>
              <option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option><option>Uttar Pradesh</option>
              <option>Uttarakhand</option><option>West Bengal</option>
            </select>
            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
        </div>
        <div class="input-group">
          <label>Crop Name</label>
          <div class="input-wrap">
            <input class="input" type="text" id="crop" placeholder="e.g. Wheat, Rice, Cotton">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V12"/><path d="M5 12c0-3.87 3.13-7 7-7s7 3.13 7 7"/></svg>
          </div>
        </div>
      </div>

      <!-- ROW 2: Area (full width) -->
      <div class="form-row-single">
        <div class="input-group">
          <label>Area (ha)</label>
          <div class="input-wrap">
            <input class="input" type="number" id="area_ha" placeholder="e.g. 2.5" min="0" step="0.1">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          </div>
        </div>
      </div>

      <!-- ROW 3: N, P, K (three columns) -->
      <div class="form-row-3cols">
        <div class="input-group"><label>Nitrogen — N (ppm)</label><div class="input-wrap"><input class="input" type="number" id="n_req" placeholder="e.g. 90" min="0"><svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div></div>
        <div class="input-group"><label>Phosphorus — P (ppm)</label><div class="input-wrap"><input class="input" type="number" id="p_req" placeholder="e.g. 45" min="0"><svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div></div>
        <div class="input-group"><label>Potassium — K (ppm)</label><div class="input-wrap"><input class="input" type="number" id="k_req" placeholder="e.g. 40" min="0"><svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div></div>
      </div>

      <!-- ROW 4: Temperature, Humidity, pH (three cols) -->
      <div class="form-row-3cols">
        <div class="input-group"><label>Temperature (°C)</label><div class="input-wrap"><input class="input" type="number" id="temperature" placeholder="28" step="any"><svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg></div></div>
        <div class="input-group"><label>Humidity (%)</label><div class="input-wrap"><input class="input" type="number" id="humidity" placeholder="0–100" min="0" max="100"><svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div></div>
        <div class="input-group"><label>Soil pH</label><div class="input-wrap"><input class="input" type="number" id="ph" placeholder="3.0–10.0" step="0.1" min="3" max="10"><svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 3l-6 18"/><path d="M15 3l6 18"/><path d="M4 12h16"/></svg></div></div>
      </div>

      <!-- ROW 5: Rainfall, Wind Speed (optional), Solar Radiation (optional) -->
      <div class="form-row-3cols">
        <div class="input-group"><label>Rainfall (mm)</label><div class="input-wrap"><input class="input" type="number" id="rainfall" placeholder="e.g. 800" min="0"><svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="19" x2="8" y2="21"/><line x1="8" y1="13" x2="8" y2="15"/><line x1="16" y1="19" x2="16" y2="21"/><line x1="16" y1="13" x2="16" y2="15"/><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg></div></div>
        <div class="input-group"><label>Wind Speed <span class="opt-tag">Optional</span> (km/h)</label><div class="input-wrap"><input class="input" type="number" id="wind_speed" placeholder="e.g. 12"><svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg></div></div>
        <div class="input-group"><label>Solar Radiation <span class="opt-tag">Optional</span> (MJ/m²)</label><div class="input-wrap"><input class="input" type="number" id="solar_radiation" placeholder="e.g. 18"><svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg></div></div>
      </div>
    </div>

    <p class="error-msg" id="error"></p>
    <button class="btn" id="predictBtn" onclick="predictYield()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Predict Yield
    </button>
  </div>
</div>

<script>
  const cropImages = {
    wheat: 'Pic/wheat.jpg', rice: 'Pic/Rice.jpg', maize: 'Pic/Maize.jpg', corn: 'Pic/Maize.jpg',
    cotton: 'Pic/Cottona.jpg', sugarcane: 'Pic/chad-stembridge-r9VxidMj-iM-unsplash.jpg',
    mango: 'Pic/Mango.jpg', soybean: 'Pic/Chickpeas 2.jpg', default: 'Pic/chad-stembridge-r9VxidMj-iM-unsplash.jpg'
  };
  function getCropImage(name) {
    const key = name.toLowerCase().trim();
    for (const [k, v] of Object.entries(cropImages)) if (key.includes(k)) return v;
    return cropImages.default;
  }

  const requiredFields = ['state_name','crop','area_ha','n_req','p_req','k_req','temperature','humidity','ph','rainfall'];
  function validate() {
    for (let id of requiredFields) {
      const el = document.getElementById(id);
      if (!el || !el.value || el.value === '') return 'Please fill all required fields.';
    }
    return '';
  }

  function confirmSignout() { if (confirm('Sign out?')) window.location.href = 'login.html'; }

  function setLoading(on) {
    const btn = document.getElementById('predictBtn');
    if (on) {
      btn.innerHTML = '<span class="spin"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span> Predicting…';
      btn.classList.add('loading');
    } else {
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Predict Yield';
      btn.classList.remove('loading');
    }
  }

  function predictYield() {
    const err = validate();
    const errEl = document.getElementById('error');
    if (err) {
      errEl.innerText = err;
      errEl.classList.add('show');
      document.getElementById('mainCard').classList.add('shake');
      setTimeout(() => document.getElementById('mainCard').classList.remove('shake'), 400);
      return;
    }
    errEl.classList.remove('show');
    const payload = {
      state_name: document.getElementById('state_name').value,
      crop: document.getElementById('crop').value,
      area_ha: +document.getElementById('area_ha').value,
      N_req: +document.getElementById('n_req').value,
      P_req: +document.getElementById('p_req').value,
      K_req: +document.getElementById('k_req').value,
      Temperature: +document.getElementById('temperature').value,
      Humidity: +document.getElementById('humidity').value,
      pH: +document.getElementById('ph').value,
      Rainfall: +document.getElementById('rainfall').value,
      Wind_Speed: +document.getElementById('wind_speed').value || null,
      Solar_Radiation: +document.getElementById('solar_radiation').value || null,
    };
    setLoading(true);
    fetch('http://localhost:5000/predict_yield', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      setLoading(false);
      if (data.success) showResult(payload, data.yield_kg_per_ha);
      else { errEl.innerText = data.error || 'Prediction failed'; errEl.classList.add('show'); }
    })
    .catch(error => { setLoading(false); errEl.innerText = 'Network error: ' + error.message; errEl.classList.add('show'); });
  }

  function showResult(p, yieldKgPerHa) {
    const left = document.getElementById('leftPanel');
    left.style.backgroundImage = `url('${getCropImage(p.crop)}')`;
    document.getElementById('leftOverlay').style.background = 'linear-gradient(160deg, rgba(5,4,2,0.45) 0%, rgba(10,18,7,0.65) 40%, rgba(3,5,2,0.92) 100%)';
    document.getElementById('waitingState').classList.add('hidden');
    document.getElementById('leftPills').style.opacity = '0';
    document.getElementById('r_state').innerText = p.state_name;
    document.getElementById('r_crop').innerText = p.crop;
    document.getElementById('r_area').innerText = p.area_ha;
    document.getElementById('r_temp').innerHTML = `${p.Temperature}<sup>°C</sup>`;
    document.getElementById('r_hum').innerHTML = `${p.Humidity}<sup>%</sup>`;
    document.getElementById('r_rain').innerHTML = `${p.Rainfall}<sup>mm</sup>`;
    document.getElementById('r_yield').innerHTML = `${yieldKgPerHa.toFixed(2)}<span class="res-yield-unit"> kg/ha</span>`;
    const totalKg = yieldKgPerHa * p.area_ha;
    document.getElementById('r_total').innerText = `≈ ${totalKg.toFixed(2)} kg total over ${p.area_ha} ha`;
    const tags = [`N ${p.N_req} ppm`, `P ${p.P_req} ppm`, `K ${p.K_req} ppm`, `pH ${p.pH}`];
    if (p.Wind_Speed) tags.push(`Wind ${p.Wind_Speed} km/h`);
    if (p.Solar_Radiation) tags.push(`Solar ${p.Solar_Radiation} MJ/m²`);
    document.getElementById('resTags').innerHTML = tags.map(t => `<div class="res-tag">${t}</div>`).join('');
    document.getElementById('resultOverlay').classList.add('visible');
  }
</script>
</body>
</html>
